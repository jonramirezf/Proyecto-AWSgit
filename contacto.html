<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body id="cuerpo">

<header>

    <h1>Contacto</h1>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="contacto.html">Contacto</a>
    </nav>

</header>

<main>

<h2>Formulario de Contacto</h2>

<form id="formContacto" novalidate>

    <label for="nombre">Nombre:</label>
    <br>
    <input type="text" id="nombre" name="nombre">
    <span id="errorNombre" class="error"></span>
    <br><br>

    <label for="correo">Correo:</label>
    <br>
    <input type="text" id="correo" name="correo">
    <span id="errorCorreo" class="error"></span>
    <br><br>

    <label for="mensaje">Mensaje:</label>
    <br>
    <textarea id="mensaje" name="mensaje" rows="5" cols="40"></textarea>
    <span id="errorMensaje" class="error"></span>
    <br><br>

    <input type="submit" id="botonEnviar" value="Enviar">

</form>

<p id="mensajeEstado"></p>

</main>

<footer>
    <hr>
    <p>Cloud Solutions © 2026</p>
</footer>

<script src="js/contacto.js"></script>

</body>
</html>
